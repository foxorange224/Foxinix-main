<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxinix</title>
    <meta name="theme-color" content="#0d0d10">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>
<body>
    <script>
      /* W80/W92: GitHub Pages sirve este 404 para cualquier ruta que no
         exista. Solo las rutas de la SPA (History API) se reescriben al
         shell con el hash legacy, para que el router interno las tome.
         Cualquier OTRA ruta se queda mostrando este 404 real: antes se
         mandaba a la portada y toda URL inventada devolvía 200 (mal
         SEO). En producción el servidor ya resuelve las rutas de la
         SPA antes de llegar aquí; este script solo actúa en GH Pages. */
      (function () {
        var path = window.location.pathname;
        /* Prefijos de rutas SPA conocidas (ROUTE_PATHS de la SPA). */
        var spa = ['/app', '/login', '/register', '/profile',
                   '/verify', '/forgot', '/reset'];
        for (var i = 0; i < spa.length; i++) {
          var p = spa[i];
          if (path === p || path.indexOf(p + '/') === 0) {
            /* app.html es el shell idéntico de todas las rutas (W91). */
            window.location.replace('/app.html' + window.location.search +
                                    '#' + path.slice(1));
            return;
          }
        }
        /* Ruta desconocida → 404 real, sin rewrite. */
      })();
    </script>
</body>
</html>
