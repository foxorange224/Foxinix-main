<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxinix Chat</title>
    <meta name="theme-color" content="#0d0d10">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>
<body>
    <script>
      /* W80: GitHub Pages sirve este 404 para cualquier ruta que no exista.
         Como la SPA vive en /, /login, /register, /app y usa History API,
         redirigimos a la ruta base correspondiente para que Vue maneje el
         routing interno. Si la ruta empieza por /app, /login o /register,
         la enviamos al index.html de esa carpeta; si no, a la portada. */
      (function () {
        var path = window.location.pathname;
        var target = '/';
        if (path.indexOf('/app/') === 0 || path === '/app') target = '/app/';
        else if (path.indexOf('/login') === 0) target = '/login/';
        else if (path.indexOf('/register') === 0) target = '/register/';
        window.location.replace(target + window.location.search + '#' + path.slice(1));
      })();
    </script>
</body>
</html>
